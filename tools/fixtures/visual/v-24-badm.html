<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>V-24 量测反例 · 顺序一致但第二张卡的按钮甩到右边</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #F7F9FC; color: #2F3540;
         font-size: 14px; line-height: 22px; font-weight: 400; }
  .page-head { padding: 0 0 16px; }
  .page-head h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; }
  .page-head p { margin: 8px 0 0; font-size: 12px; line-height: 20px; color: #5E6573; }
  .card { background: #FFFFFF; border: 1px solid #D3D7DE; border-radius: 2px; padding: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; line-height: 24px; font-weight: 600; }
  .btn { height: 32px; padding: 0 16px; border: 1px solid #D3D7DE; border-radius: 2px;
         background: #FFFFFF; color: #2F3540; font-size: 12px; }
  .btn-primary { background: #1C6EFF; border-color: #1C6EFF; color: #FFFFFF; }
  .op { display: flex; gap: 8px; padding-top: 8px; }
  /* 反例根因：槽位顺序与类名完全一致，但第二张卡把操作甩到右端——静态签名查不出，只有 bbox 能抓 */
  .op.right { justify-content: flex-end; }
</style>
</head>
<body>
  <div class="page-head">
    <h1>接入计划</h1>
    <p>示例环境 · 快照 2026-11-25 09:20 · 规模 3 个组织</p>
  </div>
  <div class="card"><h2>KP-01 研发部</h2><div class="op"><button class="btn">忽略</button><button class="btn btn-primary">查看</button></div></div>
  <div class="card"><h2>KP-02 销售部</h2><div class="op right"><button class="btn">忽略</button><button class="btn btn-primary">查看</button></div></div>
  <div class="card"><h2>KP-03 分支机构</h2><div class="op"><button class="btn">忽略</button><button class="btn btn-primary">查看</button></div></div>
</body>
</html>
