<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>V-18 反例 · 主按钮在辅按钮右侧</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #F7F9FC; color: #2F3540;
         font-size: 14px; line-height: 22px; font-weight: 400; }
  h1 { margin: 0 0 4px; font-size: 24px; line-height: 32px; font-weight: 600; }
  .sub { margin: 0 0 16px; font-size: 12px; line-height: 20px; color: #5E6573; }
  .card { background: #FFFFFF; border: 1px solid #D3D7DE; border-radius: 2px;
          padding: 16px; margin-bottom: 8px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; line-height: 24px; font-weight: 600; }
  .ops { display: flex; gap: 8px; }
  .btn { height: 32px; padding: 0 16px; border: 1px solid #D3D7DE; border-radius: 2px;
         background: #FFFFFF; color: #2F3540; font-size: 12px; }
  .btn-primary { background: #1C6EFF; border-color: #1C6EFF; color: #FFFFFF; }
</style>
</head>
<body>
  <h1>接入计划</h1>
  <p class="sub">快照 2026-11-25 09:20 · 反例：辅按钮在左、主按钮在右</p>
  <div class="card">
    <h2>KP-01 研发部</h2>
    <div class="ops" data-region="card-1-ops"><button class="btn">忽略</button><button class="btn btn-primary">查看</button></div>
  </div>
  <div class="card">
    <h2>KP-02 销售部</h2>
    <div class="ops" data-region="card-2-ops"><button class="btn">忽略</button><button class="btn btn-primary">查看</button></div>
  </div>
  <div class="card">
    <h2>KP-03 分支机构</h2>
    <div class="ops" data-region="card-3-ops"><button class="btn">忽略</button><button class="btn btn-primary">查看</button></div>
  </div>
</body>
</html>
