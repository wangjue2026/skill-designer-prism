<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>V-21 反例 · 表头无区分、行高乱、斑马线加横线、横滚无 sticky</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #F7F9FC;
         color: #2F3540; font-size: 14px; line-height: 22px; }
  h1 { margin: 0 0 16px; font-size: 24px; line-height: 32px; font-weight: 600; }
  .table-wrap { width: 640px; overflow-x: auto; border: 1px solid #D3D7DE; background: #FFFFFF; }
  table { width: 100%; min-width: 900px; border-collapse: collapse; }
  th, td { padding: 8px 12px; background: #FFFFFF; color: #2F3540;
           font-size: 12px; line-height: 20px; font-weight: 400; text-align: left;
           border-bottom: 1px solid #E1E5EB; }
  tbody tr:nth-child(2) { background: #F5F7FA; }
</style>
</head>
<body>
  <h1>组织接入清单</h1>
  <div class="table-wrap">
    <table id="org-list" data-table-overflow="true">
      <thead><tr><th>组织</th><th>接入路径</th><th>状态</th><th>操作</th></tr></thead>
      <tbody>
        <tr style="height:40px"><td>研发部</td><td>北京总部终端接入代理主链路</td><td>通过</td><td>查看</td></tr>
        <tr style="height:56px"><td>销售部</td><td>上海分部客户拜访终端浏览器接入</td><td>通过</td><td>查看</td></tr>
        <tr style="height:72px"><td>分支机构</td><td>深圳移动办公隧道接入备份链路</td><td>超时</td><td>查看</td></tr>
      </tbody>
    </table>
  </div>
  <p>示例环境 · 快照 2026-11-26 09:20 · 规模 3 组织</p>
</body>
</html>
