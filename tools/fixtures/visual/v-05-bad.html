<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>V-05 反例 · 大容器里只放两行窄文本（大面积留白）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #F7F9FC; color: #2F3540;
         font-size: 14px; line-height: 22px; font-weight: 400; }
  .page-head { padding: 0 0 16px; }
  .page-head h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; }
  .page-head p { margin: 8px 0 0; font-size: 12px; line-height: 20px; color: #5E6573; }
  /* 反例根因：容器被撑到 360px 高，内容只有标题 + 一行说明，右侧与下方全空 */
  .card { background: #FFFFFF; border: 1px solid #D3D7DE; border-radius: 2px;
          padding: 16px; margin-bottom: 16px; min-height: 360px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; line-height: 24px; font-weight: 600; }
  .card p { margin: 0; font-size: 12px; line-height: 20px; color: #5E6573; }
</style>
</head>
<body>
  <div class="page-head">
    <h1>访问诊断</h1>
    <p>示例环境 · 快照 2026-11-25 09:20 · 规模 128 终端 / 4 组织</p>
  </div>

  <div class="card">
    <h2>诊断明细</h2>
    <p>共 2 条记录</p>
  </div>

  <div class="card">
    <h2>异常分布</h2>
    <p>共 3 类原因</p>
  </div>
</body>
</html>
