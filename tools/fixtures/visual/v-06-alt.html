<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>V-06 同类异形 · 超 4 项用高级搜索：左按钮区 + 高级搜索框 + 刷新</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #F7F9FC; color: #2F3540;
         font-size: 14px; line-height: 22px; font-weight: 400; }
  .page-head { padding: 0 0 16px; }
  .page-head h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; }
  .page-head p { margin: 8px 0 0; font-size: 12px; line-height: 20px; color: #5E6573; }
  .card { background: #FFFFFF; border: 1px solid #D3D7DE; border-radius: 2px; padding: 16px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 8px 12px; border-bottom: 1px solid #E1E5EB; font-size: 12px;
           line-height: 20px; text-align: left; font-weight: 400; }
  th { background: #F4F7FB; color: #5E6573; font-weight: 600; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .btn { height: 32px; padding: 0 16px; border: 1px solid #D3D7DE; border-radius: 2px;
         background: #FFFFFF; color: #2F3540; font-size: 12px; }
  .btn-primary { background: #1C6EFF; border-color: #1C6EFF; color: #FFFFFF; }
  .field { height: 32px; padding: 0 12px; border: 1px solid #D3D7DE; border-radius: 2px;
           background: #FFFFFF; font-size: 12px; }
  .tag { display: inline-block; padding: 2px 8px; border: 1px solid #9BF2CC;
         border-radius: 2px; background: #F5FFFA; color: #015945;
         font-size: 12px; line-height: 20px; }

  .filter-bar { display: flex; align-items: center; gap: 8px; }
  .search-wrap { display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>

  <div class="page-head">
    <h1>接入状态</h1>
    <p>快照 2026-11-25 09:20 · 共 720 台终端</p>
  </div>
  <div class="filter-bar" data-region="filter-bar">
    <div class="acts">
      <button class="btn btn-primary">新建策略</button>
      <button class="btn">批量导出</button>
    </div>
    <div class="search-wrap">
      <input class="field" type="search" value="搜索终端、部门、策略（6 个条件）">
    </div>
    <button class="btn" data-act="refresh">刷新</button>
  </div>
  <div class="card">
      <table>
        <thead><tr><th>终端</th><th>部门</th><th class="num">终端数</th></tr></thead>
        <tbody>
          <tr><td>EDR-2201</td><td>研发部</td><td class="num">430</td></tr>
          <tr><td>EDR-2202</td><td>销售部</td><td class="num">290</td></tr>
          <tr><td>EDR-2203</td><td>分支机构</td><td class="num">128</td></tr>
        </tbody>
      </table></div>
</body>
</html>
