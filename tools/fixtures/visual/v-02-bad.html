<!doctype html>
<html lang="zh-CN" data-viewport-width="1440">
<head>
<meta charset="utf-8">
<title>V-02 反例 · gutter 12 与 span 6:4</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #F7F9FC; color: #2F3540; font-size: 14px; line-height: 22px; }
  .page { padding: 0 24px 24px; background: #FFFFFF; }
  h1 { margin: 0 0 16px; font-size: 24px; line-height: 32px; font-weight: 600; }
  .row { display: flex; gap: 24px; margin-bottom: 16px; }
  .row.bad-gap { gap: 12px; }
  .half-bad { width: calc(50% - 6px); }
  .span6 { width: 330px; }
  .span4 { width: 212px; }
  .box { min-height: 120px; padding: 16px; background: #F4F7FB; border: 1px solid #D3D7DE; }
  .box b { display: block; font-size: 16px; line-height: 24px; font-weight: 600; }
</style>
</head>
<body>
  <main class="page" data-page-root="主内容">
    <h1>接入概览</h1>
    <section class="row bad-gap" data-grid-row="非法 gutter 12">
      <div class="box half-bad" data-span="12"><b>在线终端</b>128 台</div>
      <div class="box half-bad" data-span="12"><b>接入组织</b>12 个</div>
    </section>
    <section class="row" data-grid-row="非法 span 6:4">
      <div class="box span6" data-span="6"><b>研发部</b>48 台</div>
      <div class="box span4" data-span="4"><b>销售部</b>42 台</div>
    </section>
    <p>示例环境 · 快照 2026-11-26 09:20 · 规模 128 终端 / 12 组织</p>
  </main>
</body>
</html>
