<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>V-21 正例 · 表头有区分，同列行高一致</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #F7F9FC; color: #2F3540;
         font-size: 14px; line-height: 22px; font-weight: 400; }
  h1 { margin: 0 0 16px; font-size: 24px; line-height: 32px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; }
  th { height: 40px; padding: 8px 12px; background: #F4F7FB; color: #5E6573;
       font-size: 12px; line-height: 20px; font-weight: 600; text-align: left;
       border-bottom: 1px solid #D3D7DE; }
  td { padding: 8px 12px; background: #FFFFFF; font-size: 12px; line-height: 20px;
       font-weight: 400; text-align: left; border-bottom: 1px solid #E1E5EB; }
  tbody tr { height: 40px; }
</style>
</head>
<body>
  <h1>组织接入清单</h1>
  <table id="org-list">
    <thead><tr><th>组织</th><th>接入路径</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>
      <tr><td>研发部</td><td>北京总部终端接入</td><td>通过</td><td>查看</td></tr>
      <tr><td>销售部</td><td>上海分部终端接入</td><td>通过</td><td>查看</td></tr>
      <tr><td>分支机构</td><td>深圳移动办公接入</td><td>超时</td><td>查看</td></tr>
    </tbody>
  </table>
  <p>示例环境 · 快照 2026-11-26 09:20 · 规模 3 组织</p>
</body>
</html>
