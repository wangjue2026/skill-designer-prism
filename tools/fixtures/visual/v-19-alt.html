<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>V-19 同类异形 · 看着违规其实合法</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #F7F9FC; color: #2F3540;
         font: 14px/22px -apple-system, "PingFang SC", sans-serif; }
  .card { background: #FFFFFF; border: 1px solid #D3D7DE; border-radius: 2px;
          padding: 16px; box-shadow: none; }
  .card-head { display: flex; align-items: center; gap: 8px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #E8F4FF; }
  .logo { width: 24px; height: 24px; border-radius: 50%; background: #FFF7E6; }
  .wf-kpi-item { border: 1px solid #EDF1F7; border-radius: 2px; padding: 12px; background: #FBFCFE; }
  .tag { display: inline-block; padding: 0 6px; border: 1px solid #9BF2CC;
         border-radius: 2px; background: #F5FFFA; color: #015945; font-size: 12px; }
  .btn { height: 32px; padding: 0 14px; border: 1px solid #1C6EFF; border-radius: 2px;
         background: #1C6EFF; color: #FFFFFF; font-size: 12px; }
  .btn:focus { outline: none; box-shadow: 0 1px 4px rgba(31,35,43,.16); }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; border-radius: 0; }
  th, td { padding: 8px 12px; border-bottom: 1px solid #E1E5EB; font-size: 12px; text-align: left; }
  th { background: #F4F7FB; color: #5E6573; font-weight: 600; }
</style>
</head>
<body>
  <section class="card">
    <div class="card-head">
      <span class="avatar"></span>
      <span class="logo"></span>
      <strong>EDR 终端管控</strong>
      <span class="tag">合规 430</span>
      <button class="btn">查看策略</button>
    </div>
    <div class="wf-kpi-item">待处理 150 台</div>
    <table>
      <thead><tr><th>终端</th><th>部门</th><th>终端数</th></tr></thead>
      <tbody>
        <tr><td>EDR-2201</td><td>研发部</td><td>430</td></tr>
        <tr><td>EDR-2202</td><td>销售部</td><td>290</td></tr>
      </tbody>
    </table>
  </section>
</body>
</html>
