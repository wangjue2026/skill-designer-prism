<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>V-10 同类异形 · 用满 5 档仍然合法</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #F7F9FC; color: #2F3540;
         font-size: 14px; line-height: 22px; font-weight: 400; }
  .page-head { padding: 0 0 16px; }
  .page-head h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; }
  .kpi-value { font-size: 20px; line-height: 28px; font-weight: 600; }
  .card-head strong { font-size: 16px; line-height: 24px; font-weight: 600; }
  .card { background: #FFFFFF; border: 1px solid #D3D7DE; border-radius: 2px; padding: 16px; }
  .tag { display: inline-block; padding: 2px 8px; border: 1px solid #9BF2CC;
         border-radius: 2px; background: #F5FFFA; color: #015945; font-size: 12px; line-height: 20px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; }
  th, td { padding: 8px 12px; border-bottom: 1px solid #E1E5EB;
           font-size: 12px; line-height: 20px; text-align: left; font-weight: 400; }
  th { background: #F4F7FB; color: #5E6573; font-weight: 600; }
</style>
</head>
<body>
  <div class="page-head">
    <h1>资产接入状态</h1>
  </div>

  <section class="card">
    <div class="card-head">
      <strong>EDR 终端管控</strong>
      <span class="kpi-value">430</span>
      <span class="tag">合规</span>
    </div>
    <table>
      <thead><tr><th>终端</th><th>部门</th><th>终端数</th></tr></thead>
      <tbody>
        <tr><td>EDR-2201</td><td>研发部</td><td>430</td></tr>
        <tr><td>EDR-2202</td><td>销售部</td><td>290</td></tr>
      </tbody>
    </table>
  </section>
</body>
</html>
