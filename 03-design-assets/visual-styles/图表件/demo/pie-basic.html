<!DOCTYPE html>
<!--
  CHART-饼图·基础（实心）
  iDux 默认是环形，实心必须显式 radius 单值；块为 270deg 横向渐变 + 1px 白描边
  改这里：DATA / 标题
  不要改：颜色、圆角、阴影、间距（都是 token 落点，见 ../../token/图表-tokens.json）
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>CHART-饼图·基础（实心）</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  body { margin: 0; padding: 16px; background: #F7F9FC; font-family: "PingFang SC", "苹方-简", sans-serif; }
  .chart { width: 100%; height: 320px; }
  .pie-wrap { display: flex; align-items: center; gap: clamp(24px, 4vw, 64px); }
  .pie-wrap .chart { width: 280px; height: 280px; flex: 0 0 280px; }
  .pie-legend { display: grid; grid-template-columns: repeat(2, 112px); column-gap: 16px; row-gap: 12px; }
  .pie-legend .li { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 1; color: #6F7785; }
  .pie-legend .dot { width: 8px; height: 8px; flex: 0 0 8px; }
  .pie-legend .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pie-legend .vl { margin-left: auto; min-width: 32px; text-align: right; color: #2F3540; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="pie-wrap">
  <div id="chart" class="chart"></div>
  <div id="legend" class="pie-legend"></div>
</div>
<script>
const GRID = '#E1E5EB', LABEL = '#6F7785', TEXT = '#2F3540';
const gradV = (a, b) => ({ type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: a }, { offset: 1, color: b }] });
const gradH = (a, b) => ({ type: 'linear', x: 1, y: 0, x2: 0, y2: 0, colorStops: [{ offset: 0, color: a }, { offset: 1, color: b }] });
const axis = {
  axisLine: { lineStyle: { color: GRID } },
  axisTick: { show: false },
  axisLabel: { color: LABEL, fontSize: 12, fontFamily: 'PingFang SC' },
  splitLine: { lineStyle: { color: GRID } },
};
const tip = { trigger: 'axis', backgroundColor: '#FBFDFF', borderColor: '#D3D7DE',
              textStyle: { color: TEXT, fontSize: 12 } };
const SHADOW = (rgb) => 'rgba(' + rgb + ',0.16)';

const DATA = [
  { value: 30,  name: '严重' },
  { value: 60,  name: '高危' },
  { value: 120, name: '中危' },
  { value: 150, name: '低危' },
  { value: 50,  name: '信息' },
  { value: 40,  name: '未定级' },
];
const COLORS = ['#F5654F', '#FFC145', '#458FFF', '#6A6AFD', '#6ED1FF', '#20CC94'];
const LIGHTER = { '#F5654F': '#FF957B', '#FFC145': '#FFE396', '#458FFF': '#8FBFFF',
                  '#6A6AFD': '#9B9BFF', '#6ED1FF': '#9EE0FF', '#20CC94': '#6EE6B6' };

echarts.init(document.getElementById('chart')).setOption({
  color: DATA.map((d, i) => ({ type: 'linear', x: 1, y: 0, x2: 0, y2: 0,
    colorStops: [{ offset: 0, color: COLORS[i % COLORS.length] },
                 { offset: 1, color: LIGHTER[COLORS[i % COLORS.length]] }] })),
  tooltip: { trigger: 'item', backgroundColor: '#FBFDFF', borderColor: '#D3D7DE', textStyle: { color: TEXT, fontSize: 12 } },
  series: [{
    type: 'pie', radius: '80%', center: ['50%', '50%'],      // 单值 = 实心饼
    label: { show: false }, labelLine: { show: false },
    itemStyle: { borderColor: '#FFFFFF', borderWidth: 1 },
    data: DATA,
  }],
});

document.getElementById('legend').innerHTML = DATA.map((d, i) => {
  const c = COLORS[i % COLORS.length];
  return '<div class="li"><span class="dot" style="background:linear-gradient(270deg,' + c + ',' + LIGHTER[c] + ')"></span>' +
    '<span class="nm">' + d.name + '</span><span class="vl">' + d.value + '</span></div>';
}).join('');
</script>
</body>
</html>
