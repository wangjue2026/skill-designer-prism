<!DOCTYPE html>
<!--
  CHART-柱状图·堆叠-竖向
  要点：多 series + stack:'Total'；**仅顶段**上端圆角；取色**按等级顺序**（红→黄→蓝）
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>CHART-柱状图·堆叠-竖向</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  body { margin: 0; padding: 16px; background: #F7F9FC;
         font-family: "PingFang SC", "苹方-简", sans-serif; }
  .chart { width: 100%; height: 320px; }
</style>
</head>
<body>
<div id="chart" class="chart"></div>
<script>
/* ===== 业务数据 ===== */
const CATS = ['11-01', '11-02', '11-03', '11-04', '11-05', '11-06', '11-07'];
const SERIES = [
  { name: '严重', data: [12, 18, 15, 24, 20, 11, 16] },
  { name: '高危', data: [38, 44, 36, 52, 48, 30, 42] },
  { name: '中危', data: [86, 102, 94, 120, 110, 78, 96] },
];

const GRID = '#E1E5EB', LABEL = '#6F7785';
/* 等级色阶：红 → 黄 → 蓝（不按系列序号随意取） */
const LEVEL = [
  { top: '#F5654F', bot: '#FF957B', shadow: 'rgba(245,101,79,0.16)' },
  { top: '#FFC145', bot: '#FFE396', shadow: null },
  { top: '#458FFF', bot: '#8FBFFF', shadow: null },
];

const axis = {
  axisLine: { lineStyle: { color: GRID } },
  axisTick: { show: false },
  axisLabel: { color: LABEL, fontSize: 12, fontFamily: 'PingFang SC' },
  splitLine: { lineStyle: { color: GRID } },
};

echarts.init(document.getElementById('chart')).setOption({
  grid: { left: 8, right: 16, top: 32, bottom: 8, containLabel: true },
  tooltip: { trigger: 'axis', backgroundColor: '#FBFDFF', borderColor: '#D3D7DE',
             textStyle: { color: '#2F3540', fontSize: 12 } },
  legend: { bottom: 0, itemWidth: 8, itemHeight: 8,
            textStyle: { color: LABEL, fontSize: 12 } },
  xAxis: { type: 'category', data: CATS, ...axis, splitLine: { show: false } },
  yAxis: { type: 'value', name: '条', nameTextStyle: { color: LABEL, fontSize: 12 }, ...axis },
  series: SERIES.map(function (s, i) {
    const c = LEVEL[i];
    const isTop = i === SERIES.length - 1;      // 仅顶段圆角
    return {
      name: s.name,
      type: 'bar',
      stack: 'Total',
      barWidth: 16,
      data: s.data,
      itemStyle: {
        color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
                 colorStops: [{ offset: 0, color: c.top }, { offset: 1, color: c.bot }] },
        borderRadius: isTop ? [1, 1, 0, 0] : 0,
        shadowColor: c.shadow, shadowBlur: c.shadow ? 10 : 0,
        shadowOffsetY: c.shadow ? -4 : 0,
      },
    };
  }),
});
</script>
</body>
</html>
