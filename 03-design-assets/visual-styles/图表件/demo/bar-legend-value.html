<!DOCTYPE html>
<!--
  CHART-柱状图·图例带数值百分比
  legend.formatter 把「数值 + 占比」拼进图例，免悬停即可比对
  改这里：DATA / 标题
  不要改：颜色、圆角、阴影、间距（都是 token 落点，见 ../../token/图表-tokens.json）
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>CHART-柱状图·图例带数值百分比</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  body { margin: 0; padding: 16px; background: #F7F9FC; font-family: "PingFang SC", "苹方-简", sans-serif; }
  .chart { width: 100%; height: 320px; }

</style>
</head>
<body>

<script>
const GRID = '#E1E5EB', LABEL = '#6F7785', TEXT = '#2F3540';
const gradV = (a, b) => ({ type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: a }, { offset: 1, color: b }] });
const gradH = (a, b) => ({ type: 'linear', x: 1, y: 0, x2: 0, y2: 0, colorStops: [{ offset: 0, color: a }, { offset: 1, color: b }] });
const axis = {
  axisLine: { lineStyle: { color: GRID } },
  axisTick: { show: false },
  axisLabel: { color: LABEL, fontSize: 12, fontFamily: 'PingFang SC' },
  splitLine: { lineStyle: { color: GRID } },
};
const tip = { trigger: 'axis', backgroundColor: '#FBFDFF', borderColor: '#D3D7DE',
              textStyle: { color: TEXT, fontSize: 12 } };
const SHADOW = (rgb) => 'rgba(' + rgb + ',0.16)';

const CATS = ['11-01','11-02','11-03','11-04','11-05','11-06','11-07'];
const SERIES = [
  { name: '服务器', data: [100, 150, 300, 88, 200, 170, 210], color: ['#458FFF', '#8FBFFF'] },
  { name: '终端',   data: [55, 88, 150, 120, 65, 90, 130], color: ['#20CC94', '#6EE6B6'] },
];
const SUM = {};
SERIES.forEach((s) => { SUM[s.name] = s.data.reduce((a, b) => a + b, 0); });
const TOTAL = Object.values(SUM).reduce((a, b) => a + b, 0);

echarts.init(document.getElementById('chart')).setOption({
  grid: { left: 8, right: 16, top: 24, bottom: 32, containLabel: true },
  tooltip: tip,
  legend: {
    bottom: 0, itemWidth: 8, itemHeight: 8, itemGap: 24,
    textStyle: { color: LABEL, fontSize: 12 },
    formatter: (name) => {
      const pct = ((SUM[name] / TOTAL) * 100).toFixed(0);
      return name + '  ' + SUM[name] + '（' + pct + '%）';
    },
  },
  xAxis: { type: 'category', data: CATS, ...axis, splitLine: { show: false } },
  yAxis: { type: 'value', name: '次', nameTextStyle: { color: LABEL, fontSize: 12 }, ...axis },
  series: SERIES.map((s) => ({
    name: s.name, type: 'bar', barWidth: 10, data: s.data,
    itemStyle: { color: gradV(s.color[0], s.color[1]), borderRadius: [1, 1, 0, 0] },
  })),
});
</script>
</body>
</html>
