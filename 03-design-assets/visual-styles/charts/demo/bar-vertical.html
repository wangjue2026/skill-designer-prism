<!DOCTYPE html>
<!--
  CHART-柱状图·基础-竖向
  用途：单系列、分类名较短、比数值高低
  改这里：DATA / 标题
  不要改：颜色、圆角、阴影、柱宽、轴色（都是 token 落点）
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>CHART-柱状图·基础-竖向</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  body { margin: 0; padding: 16px; background: #F7F9FC;
         font-family: "PingFang SC", "苹方-简", sans-serif; }
  .chart { width: 100%; height: 300px; }
</style>
</head>
<body>
<div id="chart" class="chart"></div>
<script>
/* ===== 业务数据（唯一需要改的地方） ===== */
const DATA = [186, 240, 218, 302, 275, 190, 236];
const CATS = ['11-01', '11-02', '11-03', '11-04', '11-05', '11-06', '11-07'];
const TITLE = '恶意文件拦截';

/* ===== token 常量（来自 tokens/charts.json） ===== */
const GRID = '#E1E5EB';           // 所有网格线/轴线同色
const LABEL = '#6F7785';          // 轴标签 12px
const SERIES_TOP = '#458FFF';     // 渐变色/蓝-竖 暗端
const SERIES_BOT = '#8FBFFF';     // 渐变色/蓝-竖 亮端
const SHADOW = 'rgba(69,143,255,0.16)';

const axis = {
  axisLine: { lineStyle: { color: GRID } },
  axisTick: { show: false },
  axisLabel: { color: LABEL, fontSize: 12, fontFamily: 'PingFang SC' },
  splitLine: { lineStyle: { color: GRID } },
};

echarts.init(document.getElementById('chart')).setOption({
  grid: { left: 8, right: 16, top: 24, bottom: 8, containLabel: true },
  tooltip: { trigger: 'axis', backgroundColor: '#FBFDFF', borderColor: '#D3D7DE',
             textStyle: { color: '#2F3540', fontSize: 12 } },
  title: { text: TITLE, left: 0, textStyle: { fontSize: 14, color: '#2F3540' } },
  xAxis: { type: 'category', data: CATS, ...axis, splitLine: { show: false } },
  yAxis: { type: 'value', name: '次', nameTextStyle: { color: LABEL, fontSize: 12 }, ...axis },
  series: [{
    type: 'bar',
    name: TITLE,
    barWidth: 10,                                  // iDux 默认常态宽度
    data: DATA,
    itemStyle: {
      color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1,   // 180deg 上→下
               colorStops: [{ offset: 0, color: SERIES_TOP }, { offset: 1, color: SERIES_BOT }] },
      borderRadius: [1, 1, 0, 0],                  // 竖向：上端圆角
      shadowColor: SHADOW, shadowBlur: 10, shadowOffsetY: -4,
    },
  }],
});
</script>
</body>
</html>
