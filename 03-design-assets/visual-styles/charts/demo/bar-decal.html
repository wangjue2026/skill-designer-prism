<!DOCTYPE html>
<!--
  CHART-柱状图·纹理-竖向
  itemStyle.decal 生成斜线纹理；仅在需要纹理区分时使用（打印 / 色弱），不得自造素材
  改这里：DATA / 标题
  不要改：颜色、圆角、阴影、间距（都是 token 落点，见 tokens/charts.json）
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>CHART-柱状图·纹理-竖向</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  body { margin: 0; padding: 16px; background: #F7F9FC; font-family: "PingFang SC", "苹方-简", sans-serif; }
  .chart { width: 100%; height: 320px; }

</style>
</head>
<body>

<script>
const GRID = '#E1E5EB', LABEL = '#6F7785', TEXT = '#2F3540';
const gradV = (a, b) => ({ type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: a }, { offset: 1, color: b }] });
const gradH = (a, b) => ({ type: 'linear', x: 1, y: 0, x2: 0, y2: 0, colorStops: [{ offset: 0, color: a }, { offset: 1, color: b }] });
const axis = {
  axisLine: { lineStyle: { color: GRID } },
  axisTick: { show: false },
  axisLabel: { color: LABEL, fontSize: 12, fontFamily: 'PingFang SC' },
  splitLine: { lineStyle: { color: GRID } },
};
const tip = { trigger: 'axis', backgroundColor: '#FBFDFF', borderColor: '#D3D7DE',
              textStyle: { color: TEXT, fontSize: 12 } };
const SHADOW = (rgb) => 'rgba(' + rgb + ',0.16)';

const CATS = ['终端', '服务器', '网络设备', 'IoT'];
const DATA = [320, 268, 214, 142];

echarts.init(document.getElementById('chart')).setOption({
  grid: { left: 8, right: 16, top: 24, bottom: 8, containLabel: true },
  tooltip: tip,
  xAxis: { type: 'category', data: CATS, ...axis, splitLine: { show: false } },
  yAxis: { type: 'value', name: '台', nameTextStyle: { color: LABEL, fontSize: 12 }, ...axis },
  series: [{
    type: 'bar', name: '资产数', barWidth: 18, data: DATA,
    itemStyle: {
      color: gradV('#458FFF', '#8FBFFF'),
      borderRadius: [1, 1, 0, 0],
      decal: { symbol: 'rect', symbolSize: 1, dashArrayX: [1, 0], dashArrayY: [6, 4],
               rotation: Math.PI / 4, color: 'rgba(255,255,255,0.55)' },
    },
  }],
});
</script>
</body>
</html>
