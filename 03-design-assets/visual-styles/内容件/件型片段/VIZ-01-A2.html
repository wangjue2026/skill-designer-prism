<title>件型片段 · VIZ-01-A2（单开可预览）</title>
<!--
  件型片段 · VIZ-01-A2（顶部统计概览 · 扁平指标条）
  几何出处：件型线框.md §3.8（A-实测）

  【怎么用】
  1) 直接双击本文件 → 看到的就是这个件该有的样子（若仍是"几行字"，说明 <style> 被删了）。
  2) 粘进设计说明书时，只复制「▼ 复制起点 / ▲ 复制终点」之间的那一段（.wf-kpi 块），
     **不要复制 <style>**——5.0 模板自带同名 .wf-* 原语。
  3) 只改示例数据与图标，不改结构；示例数据可整块替换为真实口径。

  【判据（照此验收）】
  ① 6 格等分且无缝（flex:1 1 0，无 gap）；整条只铺一次底、格内透明 → 不会出现"白缝"
  ② 标签在上 12/400 lh16 mb4；数值在下 24/700 ml20（= 图标 16 + gap 4，正好对齐标签文字起点）
  ③ 无边框 / 无阴影 / 无圆角；条 mb8
  ④ 默认不得预选任何一格（选中态仅 .is-on → 白底 + 底部 2px 主色内线，禁止整格反白）
  ⑤ 图标 16×16 按状态语义着色，文字不变色
  示例数据自洽：全部 1,284 = 健康 1,032 + 告警 187 + 严重 41 + 离线 18 + 未纳管 6
-->
<style>
  /* ⚠️ 预览壳样式：仅为"单独打开能看出形态"而复制自 5.0 模板 <style> 的 .wf-* 原语。
     唯一真源仍是 01-system-solution-design/⑤设计说明书/5.0-设计说明书标准模板.md，
     模板改这里跟着改；粘进说明书时不要复制本段。 */
  /* 预览底用白色：模拟列表页的 wf-shell。A2 的格底是 graphite-l50，铺在 l50 页底上会"浮不起来"
     （件型线框 §3.6 判据 4），白底才能看清 6 格等分。 */
  body { margin: 0; padding: 24px; background: #FFFFFF; color: #2F3540;
    font: 13px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .preview-stage { max-width: 1000px; }
  .wf-kpi { display: flex; align-items: stretch; margin: 0 0 8px; }
  .wf-kpi--strip { background: transparent; border: 0; box-shadow: none; border-radius: 0; }
  .wf-kpi-item { flex: 1 1 0; min-width: 0; height: 72px; padding: 0 12px 0 32px; background: #F7F9FC;
    display: flex; flex-direction: column; justify-content: center; border-bottom: 2px solid transparent; }
  .wf-kpi-item.is-on { background: #FFFFFF; border-bottom-color: #1C6EFF; }
  .wf-kpi-item__label { display: flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 400;
    line-height: 16px; color: #454C59; margin-bottom: 4px; white-space: nowrap; overflow: hidden; }
  .wf-kpi-item__icon { width: 16px; height: 16px; flex: 0 0 16px; border-radius: 2px; background: #BEC3CC; }
  .wf-kpi-item__icon.is-ok { background: #2FBF9E; }
  .wf-kpi-item__icon.is-warn { background: #FFB27A; }
  .wf-kpi-item__icon.is-danger { background: #FF7B7B; }
  .wf-kpi-item__icon.is-idle { background: #BEC3CC; }
  .wf-kpi-item__value { margin-left: 20px; font-size: 24px; font-weight: 700; line-height: 1; color: #2F3540;
    font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="preview-stage">
