  几何出处：件型线框.md §12.1 / §12.3（A-示例）

  【怎么用】
  1) 直接双击本文件 → 看到的就是这个件该有的样子（若仍是"几行字"，说明 <style> 被删了）。

  3) 类目与数值换成真实口径，结构不动；示例数据可整块替换。

  【判据（照此验收）】
  ① 行高 36 / 行底 graphite-l50 / r4 / 行内距左右 14 / 行距 8
  ② 类目区定宽 126 不收缩：图标 14 + 名称 13/400 d40 + 总数 13 d10（数字等宽）
  ③ 构成区 ml16 / max216：数值行 12px 三段定宽 70/52/44（正常 / 一般 / 差），数字 d20 等宽右对齐
  ④ 条 h4 / r full / 段间无 gap 无圆角 / 轨道 graphite-l40；段色有序 green → orange-l10 → red-l10
  ⑤ 段宽 = 各状态数 ÷ 合计，图例数字与段宽必须自洽；构成区与数值行同基线
  示例数据自洽：分支 22+0+2=24；终端 3,546+13+9=3,568；应用 157+2+12=171
-->
